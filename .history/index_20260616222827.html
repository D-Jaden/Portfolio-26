<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mission Brief</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Share Tech Mono', monospace;
    }

    .terminal {
      width: 480px;
      background: #0a0a0a;
      border: 2px solid #444;
      color: #d0d0d0;
      position: relative;
      overflow: hidden;
    }

    /* CRT scanlines overlay */
    .scanlines {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 2px,
        rgba(0, 0, 0, 0.18) 2px,
        rgba(0, 0, 0, 0.18) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    /* Subtle vignette */
    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.55) 100%);
      pointer-events: none;
      z-index: 99;
    }

    /* ── Header ── */
    .terminal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111;
      border-bottom: 1px solid #444;
      padding: 7px 12px;
      font-size: 11px;
      letter-spacing: 2px;
      color: #888;
    }

    .header-badge {
      font-family: 'VT323', monospace;
      font-size: 20px;
      color: #fff;
      letter-spacing: 2px;
    }

    .signal-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      letter-spacing: 2px;
    }

    .signal-bars {
      display: flex;
      align-items: flex-end;
      gap: 2px;
    }

    .signal-bars span {
      display: inline-block;
      width: 5px;
      background: #ccc;
    }
    .signal-bars span:nth-child(1) { height: 5px; }
    .signal-bars span:nth-child(2) { height: 8px; }
    .signal-bars span:nth-child(3) { height: 11px; }
    .signal-bars span:nth-child(4) { height: 14px; opacity: 0.3; }

    /* ── Body ── */
    .terminal-body {
      padding: 16px 16px 20px;
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .section-label {
      font-size: 10px;
      letter-spacing: 3px;
      color: #555;
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .callsign {
      font-family: 'VT323', monospace;
      font-size: 42px;
      letter-spacing: 3px;
      color: #fff;
      line-height: 1;
    }

    .access-block {
      text-align: right;
    }

    .access-label {
      font-family: 'VT323', monospace;
      font-size: 15px;
      color: #555;
      letter-spacing: 2px;
    }

    .access-stars {
      font-family: 'VT323', monospace;
      font-size: 15px;
      color: #444;
      letter-spacing: 2px;
    }

    .divider {
      border: none;
      border-top: 1px solid #2a2a2a;
      margin: 10px 0;
    }

    .divider-bright {
      border: none;
      border-top: 1px solid #333;
      margin: 10px 0;
    }

    /* ── Meta rows ── */
    .meta-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      letter-spacing: 2px;
      color: #555;
      margin-bottom: 7px;
    }

    .meta-val {
      color: #bbb;
    }

    .status-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #d0d0d0;
      margin-right: 5px;
      vertical-align: middle;
      animation: blink-dot 1.4s ease-in-out infinite;
    }

    /* ── Brief box ── */
    .brief-box {
      border: 1px solid #2a2a2a;
      padding: 13px;
      margin-top: 14px;
      min-height: 110px;
      background: #0d0d0d;
      position: relative;
    }

    /* pixel corner accents */
    .brief-box::before,
    .brief-box::after {
      content: '';
      position: absolute;
      width: 7px;
      height: 7px;
      border-color: #444;
      border-style: solid;
    }
    .brief-box::before { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
    .brief-box::after  { top: -1px; right: -1px; border-width: 1px 1px 0 0; }

    .brief-box-inner {
      position: relative;
    }
    .brief-box-inner::before,
    .brief-box-inner::after {
      content: '';
      position: absolute;
      width: 7px;
      height: 7px;
      border-color: #444;
      border-style: solid;
      bottom: -14px;
    }
    .brief-box-inner::before { left: -14px; border-width: 0 0 1px 1px; }
    .brief-box-inner::after  { right: -14px; border-width: 0 1px 1px 0; }

    .brief-label {
      font-size: 9px;
      letter-spacing: 3px;
      color: #444;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    #brief-text {
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
      color: #d0d0d0;
      line-height: 1.75;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 14px;
      background: #d0d0d0;
      vertical-align: middle;
      margin-left: 1px;
      animation: blink-cursor 0.8s step-end infinite;
    }

    /* ── Footer ── */
    .terminal-footer {
      border-top: 1px solid #1e1e1e;
      background: #0d0d0d;
      padding: 7px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 9px;
      letter-spacing: 2px;
      color: #3a3a3a;
    }

    .footer-icon {
      font-size: 14px;
      letter-spacing: 0;
      color: #3a3a3a;
    }

    /* ── Animations ── */
    @keyframes blink-cursor {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    @keyframes blink-dot {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.2; }
    }
  </style>
</head>
<body>

  <div class="terminal">
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <!-- Header -->
    <div class="terminal-header">
      <span class="header-badge">SYS // BRIEF</span>
      <div class="signal-group">
        <span>SIGNAL</span>
        <div class="signal-bars">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>

    <!-- Body -->
    <div class="terminal-body">

      <div class="top-row">
        <div>
          <div class="section-label">AGENT</div>
          <div class="callsign">J D-001</div>
        </div>
        <div class="access-block">
          <div class="access-label">ACCESS</div>
          <div class="access-stars">* * * * * * * *</div>
        </div>
      </div>

      <hr class="divider-bright">

      <div class="meta-row">
        <span>UNIT</span>
        <span class="meta-val">CS // DEV OPS</span>
      </div>
      <div class="meta-row">
        <span>SEC CODE</span>
        <span class="meta-val">NIC-CS-051</span>
      </div>
      <div class="meta-row">
        <span>STATUS</span>
        <span class="meta-val"><span class="status-dot"></span>ACTIVE</span>
      </div>

      <!-- Brief Box -->
      <div class="brief-box">
        <div class="brief-box-inner">
          <div class="brief-label">// MISSION BRIEF</div>
          <div id="brief-text"></div><span class="cursor" id="cursor"></span>
        </div>
      </div>

    </div>

    <!-- Footer -->
    <div class="terminal-footer">
      <span class="footer-icon">&#9889;&#9889;</span>
      <span>PROPERTY OF // PORTFOLIO UNIT</span>
      <span class="footer-icon">&#9889;&#9889;</span>
    </div>
  </div>

  <script>
    const lines = [
      "HELLO.",
      " ",
      "WELCOME TO MY PORTFOLIO.",
      " ",
      "[ MORE DETAILS INCOMING... ]"
    ];

    const fullText = lines.join('\n');
    const el = document.getElementById('brief-text');
    let i = 0;

    function type() {
      if (i < fullText.length) {
        el.textContent += fullText[i];
        i++;
        const ch = fullText[i - 1];
        const delay = ch === '\n' ? 200
                    : ch === '.' ? 130
                    : Math.random() * 45 + 25;
        setTimeout(type, delay);
      }
    }

    setTimeout(type, 900);
  </script>

</body>
</html>
