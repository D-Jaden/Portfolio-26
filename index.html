<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mission Brief</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&family=Mr+Dafoe&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="loading_styles.css?v=24"/>
</head>
<body>

  <!-- Grid Loading Overlay -->
  <div id="grid-overlay">
    <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Faint grid pattern -->
        <pattern id="faint-grid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(18, 18, 176, 0.1)" stroke-width="1" />
        </pattern>
      </defs>
      
      <!-- The Background Cover -->
      <rect width="100%" height="100%" fill="#ffffff" />
      <!-- Grid Overlay Cover -->
      <rect width="100%" height="100%" fill="url(#faint-grid)" />

      <!-- HUD Reticle Group -->
      <g id="hud-group" stroke="#1212B0" fill="none" stroke-width="1.5">
        <!-- Center crosshairs (guide) -->
        <path d="M 50% 0 L 50% 100%" stroke="rgba(18, 18, 176, 0.2)" stroke-dasharray="2 4" class="hud-draw" />
        <path d="M 0 50% L 100% 50%" stroke="rgba(18, 18, 176, 0.2)" stroke-dasharray="2 4" class="hud-draw" />
        
        <!-- Outer Box -->
        <rect x="calc(50% - 200px)" y="calc(50% - 150px)" width="400" height="300" fill="none" stroke-dasharray="4 6" class="hud-draw" />
        <!-- Inner Box -->
        <rect x="calc(50% - 80px)" y="calc(50% - 60px)" width="160" height="120" fill="none" stroke-dasharray="4 6" class="hud-draw" />
        
        <!-- Crosshairs with nodes -->
        <g class="hud-lines">
          <!-- Top -->
          <path d="M calc(50% - 30px) calc(50% - 150px) L calc(50% + 30px) calc(50% - 150px)" class="hud-draw" />
          <circle cx="50%" cy="calc(50% - 150px)" r="3" fill="#1212B0" class="hud-pop" />
          <path d="M 50% calc(50% - 150px) L 50% calc(50% - 170px)" class="hud-draw" />
          
          <!-- Bottom -->
          <path d="M calc(50% - 30px) calc(50% + 150px) L calc(50% + 30px) calc(50% + 150px)" class="hud-draw" />
          <circle cx="50%" cy="calc(50% + 150px)" r="3" fill="#1212B0" class="hud-pop" />
          <path d="M 50% calc(50% + 150px) L 50% calc(50% + 170px)" class="hud-draw" />
          
          <!-- Left -->
          <path d="M calc(50% - 200px) calc(50% - 30px) L calc(50% - 200px) calc(50% + 30px)" class="hud-draw" />
          <circle cx="calc(50% - 200px)" cy="50%" r="3" fill="#1212B0" class="hud-pop" />
          <path d="M calc(50% - 200px) 50% L calc(50% - 220px) 50%" class="hud-draw" />
          
          <!-- Right -->
          <path d="M calc(50% + 200px) calc(50% - 30px) L calc(50% + 200px) calc(50% + 30px)" class="hud-draw" />
          <circle cx="calc(50% + 200px)" cy="50%" r="3" fill="#1212B0" class="hud-pop" />
          <path d="M calc(50% + 200px) 50% L calc(50% + 220px) 50%" class="hud-draw" />

          <!-- Inner bounds -->
          <path d="M calc(50% - 15px) calc(50% - 60px) L calc(50% + 15px) calc(50% - 60px)" class="hud-draw" />
          <path d="M calc(50% - 15px) calc(50% + 60px) L calc(50% + 15px) calc(50% + 60px)" class="hud-draw" />
          <path d="M calc(50% - 80px) calc(50% - 15px) L calc(50% - 80px) calc(50% + 15px)" class="hud-draw" />
          <path d="M calc(50% + 80px) calc(50% - 15px) L calc(50% + 80px) calc(50% + 15px)" class="hud-draw" />
        </g>
        
        <circle cx="50%" cy="50%" r="3" fill="#1212B0" class="hud-pop" />
      </g>
      
      <!-- Loading Percentage Text -->
      <text id="loading-pct" x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="'Share Tech Mono', monospace" font-size="24" fill="#1212B0">0%</text>
    </svg>
  </div>  <!-- 3D Scene Containers -->
  <div id="webgl-container"></div>
  <div id="css3d-container"></div>

  <!-- Boot Prompt Overlay -->
  <div id="boot-prompt" class="hidden">
    <div class="prompt-text">POWER OFF</div>
    <div class="prompt-sub">Click the power button on the CPU tower to start.</div>
  </div>
  <!-- The Background Neon Sign -->
  <div class="neon-sign-container" style="display: none;">
    <h1 class="neon-sign">In The Lab</h1>
  </div>

  <div class="terminal off">
    <div class="scanlines"></div>

    <!-- Header -->
    <div class="terminal-header">
      <span class="header-badge">SYSTEM // BRIEF</span>
      <div class="signal-group">
        <span>SIGNAL</span>
        <div class="signal-bars">
          <span></span><span></span><span></span><span></span>
        </div>
      </div>
    </div>

    <!-- Live clock bar -->
    <div class="clock-bar">
      <span id="live-date"></span>
      <span id="live-time"></span>
    </div>

    <!-- Body -->
    <div class="terminal-body">

      <div class="top-row">
        <div>
          <div class="section-label">AGENT</div>
          <div class="callsign">J D-001</div>
        </div>
        <div class="access-block">
          <div class="access-label">ACCESS</div>
          <div class="access-stars">* * * * * * * *</div>
        </div>
      </div>

      <hr class="divider-bright">

      <div class="meta-row">
        <span>UNIT</span>
        <span class="meta-val">CS // FULL STACK DEV</span>
      </div>
      <div class="meta-row">
        <span>SEC CODE</span>
        <span class="meta-val">#J002</span>
      </div>
      <div class="meta-row">
        <span>STATUS</span>
        <span class="meta-val"><span class="status-dot"></span>ACTIVE</span>
      </div>

      <!-- Brief Box -->
      <div class="brief-box brief-corners-bottom">
        <div class="brief-label">// MISSION BRIEF</div>
        <div id="brief-text"></div><span class="cursor" id="cursor"></span>
        <button id="start-btn">[ INITIATE SEQUENCE ]</button>
      </div>

    </div>

    <!-- Footer -->
    <div class="terminal-footer">
      <span>&#9889;&#9889;</span>
      <span>PROPERTY OF JADEN</span>
      <span>&#9889;&#9889;</span>
    </div>
  </div>

  <!-- Three.js Dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
  
  <script src="https://unpkg.com/animejs@4.4.1/dist/bundles/anime.umd.js"></script>
  <script src="loading.js?v=24"></script>

</body>
</html>
